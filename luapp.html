<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Jugando - Niños de 1 a 5 años</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Bubblegum Sans', cursive, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 600px;
            width: 95%;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.2rem;
            margin-top: 5px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0px #ffd166;
        }

        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            background-color: #4ecdc4;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0px #3dbbb3;
            transition: transform 0.1s, background-color 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #3dbbb3;
        }

        .btn-start { background-color: #ff6b6b; box-shadow: 0 5px 0px #e05252; font-size: 1.6rem; padding: 18px 40px; grid-column: span 2; }
        .btn-animals { background-color: #fb5607; box-shadow: 0 5px 0px #d44600; }
        .btn-colors { background-color: #ffbe0b; box-shadow: 0 5px 0px #d9a000; color: #444; }
        .btn-numbers { background-color: #8338ec; box-shadow: 0 5px 0px #6721ca; }
        .btn-vowels { background-color: #3a86ff; box-shadow: 0 5px 0px #1d65db; }
        .btn-shapes { background-color: #06d6a0; box-shadow: 0 5px 0px #04ad81; }
        .btn-emotions { background-color: #ff007f; box-shadow: 0 5px 0px #c70063; }
        .btn-game { background-color: #ff007f; box-shadow: 0 5px 0px #cc0066; grid-column: span 2; font-size: 1.4rem; }
        
        .btn-back { 
            background-color: #6c757d; 
            box-shadow: 0 4px 0px #495057; 
            font-size: 1rem; 
            padding: 10px 20px; 
            margin-top: 15px;
            display: inline-flex;
        }

        .hidden { display: none !important; }

        .interactive-box {
            font-size: 5.5rem;
            margin: 15px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 20px;
            background: #f8f9fa;
            border: 3px dashed #ffd166;
            transition: transform 0.2s;
        }

        .interactive-box:hover {
            transform: scale(1.03);
        }

        .interactive-box:active {
            transform: scale(0.95);
        }

        .message-box {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff007f;
            min-height: 50px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-elements {
            font-size: 2rem;
            min-height: 40px;
            margin-bottom: 10px;
        }

        /* Área de Juego de Preguntas */
        .quiz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .quiz-option {
            font-size: 3.5rem;
            background: #f0f0f0;
            border: 3px solid #ddd;
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .quiz-option:active {
            transform: scale(0.92);
        }

        /* Estilos del autor */
        footer {
            font-size: 0.95rem;
            color: #444;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Animación de rebote */
        .bounce {
            animation: bounceAnim 0.5s ease;
        }

        @keyframes bounceAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Inicio -->
        <div id="home-screen">
            <h1>🎨 ¡Aprende Jugando! 🧸</h1>
            <p>Un espacio mágico e interactivo para explorar, aprender y divertirse.</p>
            <button class="btn btn-start" onclick="showMenu()">¡Comenzar a Jugar! 🚀</button>
        </div>

        <!-- Menú Principal con Más Aprendizaje -->
        <div id="menu-screen" class="hidden">
            <h1>Elige qué aprender hoy</h1>
            <div class="grid-menu">
                <button class="btn btn-animals" onclick="openSection('animals')">🐶 Animales</button>
                <button class="btn btn-colors" onclick="openSection('colors')">🎨 Colores</button>
                <button class="btn btn-numbers" onclick="openSection('numbers')">🔢 Números</button>
                <button class="btn btn-vowels" onclick="openSection('vowels')">🅰️ Vocales</button>
                <button class="btn btn-shapes" onclick="openSection('shapes')">📐 Formas</button>
                <button class="btn btn-emotions" onclick="openSection('emotions')">😀 Emociones</button>
                <button class="btn btn-game" onclick="startQuiz()">🎮 ¡Juego de Preguntas!</button>
            </div>
            <button class="btn btn-back" onclick="showHome()">🏠 Inicio</button>
        </div>

        <!-- Pantalla de Actividad de Aprendizaje -->
        <div id="activity-screen" class="hidden">
            <h2 id="section-title" style="color: #3a86ff; margin-bottom: 5px;"></h2>
            <p style="font-size: 0.9rem; margin-bottom: 10px;">¡Toca el recuadro para ver el siguiente!</p>
            
            <div class="interactive-box" id="display-item" onclick="nextItem()">🍎</div>
            <div class="visual-elements" id="visual-count"></div>
            <div class="message-box" id="message">¡Toca la pantalla!</div>
            
            <button class="btn btn-back" onclick="showMenu()">⬅ Volver al Menú</button>
        </div>

        <!-- Pantalla de Juego / Desafío -->
        <div id="quiz-screen" class="hidden">
            <h2 style="color: #ff007f;">🎮 ¡Encuentra la respuesta!</h2>
            <div class="message-box" id="quiz-question">¿Dónde está...?</div>
            
            <div class="quiz-grid" id="quiz-options">
                <!-- Opciones generadas por JS -->
            </div>
            
            <button class="btn btn-back" onclick="showMenu()">⬅ Volver al Menú</button>
        </div>
    </div>

    <!-- Pie de página con créditos -->
    <footer>
        ✨ Creado con amor por <span>Luisa Montenegro</span> y <span>Jostin Zambrano</span> ✨
    </footer>

    <script>
        let currentSection = '';
        let currentIndex = 0;
        let quizCorrectAnswer = null;

        // Base de Datos de Aprendizaje Completa
        const contentData = {
            animals: [
                { item: '🐶', text: '¡Guau Guau! Es el Perro', visuals: '🐕 🦴' },
                { item: '🐱', text: '¡Miau Miau! Es el Gato', visuals: '🐈 🐟' },
                { item: '🐮', text: '¡Muuu! Es la Vaca', visuals: '🐄 🥛' },
                { item: '🐷', text: '¡Oink Oink! Es el Cerdito', visuals: '🐖 泥' },
                { item: '🦁', text: '¡Roar! Es el León, el rey de la selva', visuals: '🦁 👑' },
                { item: '🐸', text: '¡Croac Croac! Es la Rana', visuals: '🐸 🌿' }
            ],
            colors: [
                { item: '🔴', text: 'Color Rojo: ¡Como una rica manzana!', visuals: '🍎 🍓 🎈' },
                { item: '🔵', text: 'Color Azul: ¡Como el cielo y el mar!', visuals: '🌊 ☁️ 🐟' },
                { item: '🟡', text: 'Color Amarillo: ¡Como el brillante Sol!', visuals: '☀️ 🍌 🐥' },
                { item: '🟢', text: 'Color Verde: ¡Como las hojas de los árboles!', visuals: '🌿 🐸 🍏' },
                { item: '🟣', text: 'Color Morado: ¡Como las deliciosas uvas!', visuals: '🍇 🍆 👾' },
                { item: '🟠', text: 'Color Naranja: ¡Como una jugosa naranja!', visuals: '🍊 🦊 🥕' }
            ],
            numbers: [
                { item: '1️⃣', text: 'Número 1: ¡Un dedito arriba!', visuals: '☝️' },
                { item: '2️⃣', text: 'Número 2: ¡Dos ojitos para ver!', visuals: '👀' },
                { item: '3️⃣', text: 'Número 3: ¡Tres globos flotando!', visuals: '🎈 🎈 🎈' },
                { item: '4️⃣', text: 'Número 4: ¡Cuatro patitas de perro!', visuals: '🐾 🐾 🐾 🐾' },
                { item: '5️⃣', text: 'Número 5: ¡Cinco dedos en la mano!', visuals: '🖐️' }
            ],
            vowels: [
                { item: '🅰️', text: 'Vocal A: ¡De Avión y Abeja!', visuals: '✈️ 🐝 🍎' },
                { item: '🅱️', text: 'Vocal E: ¡De Elefante y Estrella!', visuals: '🐘 ⭐️ 🦔' },
                { item: '🅸', text: 'Vocal I: ¡De Iguana e Isla!', visuals: '🦎 🏝️ 🍦' },
                { item: '🅾️', text: 'Vocal O: ¡De Oso y Oveja!', visuals: '🐻 🐑 🌊' },
                { item: '🆄', text: 'Vocal U: ¡De Uvas y Unicornio!', visuals: '🍇 🦄 🧲' }
            ],
            shapes: [
                { item: '🟡', text: 'El Círculo: ¡Es redondo como una pelota!', visuals: '⚽️ 🏀 🪙' },
                { item: '🟦', text: 'El Cuadrado: ¡Tiene 4 lados iguales!', visuals: '📦 🖼️ ⏹️' },
                { item: '🔺', text: 'El Triángulo: ¡Tiene 3 puntas!', visuals: '🍕 🔺 📐' },
                { item: '⭐️', text: 'La Estrella: ¡Brilla en el cielo!', visuals: '🌟 ✨ 🌠' },
                { item: '❤️', text: 'El Corazón: ¡Simboliza el amor!', visuals: '💖 💕 💗' }
            ],
            emotions: [
                { item: '😀', text: '¡Feliz! Sonreímos cuando estamos contentos', visuals: '🎉 🎈 ☀️️' },
                { item: '😢', text: 'Triste: A veces lloramos, pero todo estará bien', visuals: '🌧️ 💧 🧸' },
                { item: '😡', text: 'Enojado: Respiramos profundo para calmar la molestia', visuals: '🌬️ 🧘‍♂️ ☮️' },
                { item: '😲', text: 'Sorprendido: ¡Cosas mágicas e increíbles!', visuals: '🎁 🪄 🚀' },
                { item: '😴', text: 'Con Sueño: Es hora de descansar y soñar bonito', visuals: '🌙 🛏️ 💤' }
            ]
        };

        // Función para reproducción de voz sintética
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function showHome() {
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('activity-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
        }

        function showMenu() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('activity-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            speak("Elige qué quieres aprender hoy");
        }

        function openSection(section) {
            currentSection = section;
            currentIndex = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('activity-screen').classList.remove('hidden');
            
            const titles = {
                animals: "🐶 Animales y Sonidos",
                colors: "🎨 Aprendamos Colores",
                numbers: "🔢 Contemos Números",
                vowels: "🅰️ Las Vocales",
                shapes: "📐 Formas Geométricas",
                emotions: "😀 Las Emociones"
            };
            
            document.getElementById('section-title').innerText = titles[section];
            updateDisplay();
        }

        function nextItem() {
            let data = contentData[currentSection];
            currentIndex = (currentIndex + 1) % data.length;
            
            const box = document.getElementById('display-item');
            box.classList.remove('bounce');
            void box.offsetWidth; 
            box.classList.add('bounce');
            
            updateDisplay();
        }

        function updateDisplay() {
            let data = contentData[currentSection][currentIndex];
            document.getElementById('display-item').innerText = data.item;
            document.getElementById('message').innerText = data.text;
            document.getElementById('visual-count').innerText = data.visuals || '';
            
            speak(data.text);
        }

        // Minijuego Interactivos
        function startQuiz() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            const categories = ['animals', 'colors', 'vowels', 'shapes'];
            const randomCategory = categories[Math.floor(Math.random() * categories.length)];
            const list = contentData[randomCategory];
            
            // Seleccionar 1 respuesta correcta y 3 distractores
            const target = list[Math.floor(Math.random() * list.length)];
            quizCorrectAnswer = target;

            // Barajar opciones
            let options = [target];
            while (options.length < 4) {
                let randomOpt = list[Math.floor(Math.random() * list.length)];
                if (!options.includes(randomOpt)) {
                    options.push(randomOpt);
                }
            }
            options.sort(() => Math.random() - 0.5);

            // Extraer nombre del objeto a buscar
            const questionText = `¿Dónde está: ${target.text.split(':')[0]}?`;
            document.getElementById('quiz-question').innerText = questionText;
            speak(questionText);

            const grid = document.getElementById('quiz-options');
            grid.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'quiz-option';
                btn.innerText = opt.item;
                btn.onclick = () => checkQuizAnswer(opt);
                grid.appendChild(btn);
            });
        }

        function checkQuizAnswer(selected) {
            if (selected === quizCorrectAnswer) {
                speak("¡Muy bien! ¡Excelente!");
                document.getElementById('quiz-question').innerText = "🎉 ¡Correcto! ¡Súper bien! 🎉";
                setTimeout(nextQuizQuestion, 1800);
            } else {
                speak("Inténtalo de nuevo");
                document.getElementById('quiz-question').innerText = "❌ ¡Inténtalo otra vez! 💫";
            }
        }
    </script>
</body>
</html>
