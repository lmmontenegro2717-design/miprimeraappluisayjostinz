<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Bosque Mágico de las Maravillas 🌲✨ - Juegos Didácticos (1-5 años)</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ESTILOS GENERALES Y RESETS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bubblegum Sans', 'Arial Rounded MT Bold', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #70d6ff 0%, #a0c4ff 40%, #bdb2ff 70%, #caffbf 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #2b2d42;
        }

        /* --- FONDO ANIMADO DE BOSQUE MÁGICO --- */
        .sky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            opacity: 0.95;
            animation: moveClouds linear infinite;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.05));
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
        }

        .cloud1 { width: 140px; height: 45px; top: 30px; left: -160px; animation-duration: 30s; }
        .cloud1::before { width: 60px; height: 60px; top: -25px; left: 20px; }
        .cloud1::after { width: 45px; height: 45px; top: -18px; left: 65px; }

        .cloud2 { width: 180px; height: 55px; top: 110px; left: -220px; animation-duration: 42s; animation-delay: 6s; }
        .cloud2::before { width: 75px; height: 75px; top: -35px; left: 30px; }
        .cloud2::after { width: 55px; height: 55px; top: -22px; left: 95px; }

        .cloud3 { width: 120px; height: 40px; top: 220px; left: -140px; animation-duration: 28s; animation-delay: 15s; }
        .cloud3::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud3::after { width: 40px; height: 40px; top: -15px; left: 50px; }

        @keyframes moveClouds {
            0% { transform: translateX(-10vw); }
            100% { transform: translateX(110vw); }
        }

        .sparkle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffea00, 0 0 20px #ffea00;
            animation: floatSparkle 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes floatSparkle {
            0%, 100% { transform: translateY(0) scale(0.5); opacity: 0.2; }
            50% { transform: translateY(-40px) scale(1.2); opacity: 1; }
        }

        /* --- CABECERA Y MASCOTA --- */
        header {
            text-align: center;
            padding: 20px 10px;
            position: relative;
            z-index: 10;
        }

        .main-title {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            color: #ff5964;
            text-shadow: 4px 4px 0px #ffffff, 7px 7px 0px #ffd166;
            letter-spacing: 2px;
            animation: pulseTitle 2.5s infinite alternate ease-in-out;
            margin-bottom: 10px;
        }

        @keyframes pulseTitle {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.04) rotate(1deg); }
        }

        .mascot-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.7);
            padding: 12px 25px;
            border-radius: 50px;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            max-width: 90%;
        }

        .mascot-wrapper:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.95);
        }

        .mascot-avatar {
            font-size: clamp(3rem, 6vw, 4.5rem);
            animation: mascotBounce 2s infinite ease-in-out;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.15));
        }

        @keyframes mascotBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .speech-bubble {
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 25px;
            border: 4px solid #35a7ff;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: bold;
            color: #2b2d42;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -16px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 10px 16px 10px 0;
            border-style: solid;
            border-color: transparent #35a7ff transparent transparent;
        }

        /* --- MAPA DE ISLAS / CONTENEDOR DE JUEGOS --- */
        .game-map {
            max-width: 1200px;
            margin: 15px auto 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .island-card {
            background: linear-gradient(145deg, #ffffff, #fff8e7);
            border-radius: 35px;
            padding: 25px 20px;
            text-align: center;
            border: 6px solid #ffd166;
            box-shadow: 0 12px 0px #e5b23a, 0 15px 25px rgba(0,0,0,0.15);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 270px;
        }

        .island-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 18px 0px #e5b23a, 0 20px 30px rgba(0,0,0,0.2);
        }

        .island-card:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #e5b23a, 0 8px 15px rgba(0,0,0,0.15);
        }

        .island-icon {
            font-size: 4.5rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: wiggle 3.5s infinite ease-in-out;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.1));
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(8deg); }
            60% { transform: rotate(-4deg); }
            80% { transform: rotate(4deg); }
        }

        .island-card h2 {
            font-size: 1.6rem;
            color: #35a7ff;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0px #fff;
        }

        .island-card p {
            font-size: 0.98rem;
            color: #5c6b73;
            margin-bottom: 18px;
            line-height: 1.3;
            font-weight: 600;
        }

        .btn-play {
            background: #06d6a0;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 6px 0px #049a73, 0 8px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            width: 85%;
            margin: 0 auto;
            transition: all 0.15s;
            letter-spacing: 0.5px;
        }

        .btn-play:hover {
            background: #05c290;
        }

        /* --- MODAL DE JUEGOS --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 15px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 720px;
            border-radius: 40px;
            padding: 25px 20px 30px;
            text-align: center;
            border: 8px solid #ff6b6b;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            position: relative;
            animation: popUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 92vh;
            overflow-y: auto;
        }

        @keyframes popUp {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff5252;
            color: white;
            border: 4px solid white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .close-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        .game-title {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: #ff5252;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px #ffe5d9;
        }

        .game-instruction {
            font-size: 1.2rem;
            color: #2b2d42;
            font-weight: 700;
            margin-bottom: 15px;
            background: #f0f3f8;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }

        /* --- JUEGO 1: GLOBOS Y BURBUJAS --- */
        #balloon-canvas {
            height: 350px;
            background: linear-gradient(180deg, #e0f7fa 0%, #ffffff 100%);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            border: 5px dashed #4dd0e1;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            touch-action: none;
        }

        .balloon-item {
            position: absolute;
            bottom: -100px;
            cursor: pointer;
            animation: floatUp 4s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
        }

        .balloon-item::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 14px;
            background: #888;
        }

        .bubble-item {
            position: absolute;
            bottom: -80px;
            cursor: pointer;
            animation: floatUp 5s linear infinite;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(120,200,255,0.4));
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(120,200,255,0.5);
        }

        @keyframes floatUp {
            0% { bottom: -100px; }
            100% { bottom: 400px; }
        }

        /* --- JUEGO 2: VALLE DE COLORES Y FORMAS --- */
        .shape-display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 170px;
            margin: 15px 0;
        }

        .target-shape {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .target-shape.circle { width: 140px; height: 140px; border-radius: 50%; }
        .target-shape.square { width: 130px; height: 130px; border-radius: 20px; }
        .target-shape.triangle {
            width: 0; height: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 130px solid currentColor;
            background: transparent !important;
        }
        .target-shape.star {
            font-size: 130px;
            line-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .shape-btn {
            padding: 14px 22px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 22px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2), 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shape-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2);
        }

        /* --- JUEGO 3: ANIMALES CANTANTES --- */
        .animal-farm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .farm-card {
            background: #fff9c4;
            border: 4px solid #fbc02d;
            border-radius: 28px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 0px #f57f17;
        }

        .farm-card:hover {
            transform: scale(1.08) rotate(2deg);
            background: #fff59d;
        }

        .farm-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #f57f17;
        }

        .farm-emoji {
            font-size: 4rem;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
            margin-bottom: 5px;
        }

        .farm-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #d32f2f;
        }

        /* --- JUEGO 4: CUENTA FRUTOS --- */
        .fruit-tree-area {
            min-height: 240px;
            background: #d8f3dc;
            border: 5px solid #74c69d;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 20px;
            margin: 15px 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }

        .fruit-item {
            font-size: 4.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            animation: fruitPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.15));
        }

        .fruit-item.harvested {
            transform: scale(0);
            opacity: 0;
        }

        @keyframes fruitPop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .number-pad {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .num-btn {
            background: #ff9f1c;
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0px #c57b0d, 0 8px 12px rgba(0,0,0,0.15);
            transition: transform 0.15s;
        }

        .num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #c57b0d;
        }

        /* --- JUEGO 5: PIANO MÁGICO --- */
        .piano-keyboard {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0 10px;
            height: 220px;
            padding: 10px;
            background: #2b2d42;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .piano-key {
            flex: 1;
            border-radius: 0 0 18px 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s, filter 0.1s;
            max-width: 80px;
        }

        .piano-key:active, .piano-key.active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.3);
            filter: brightness(1.2);
        }

        /* --- JUEGO 6: PAREJAS / MEMORIA --- */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 480px;
            margin: 15px auto;
        }

        .memory-card {
            height: 110px;
            background: #35a7ff;
            border: 4px solid #fff;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.2rem;
            cursor: pointer;
            box-shadow: 0 6px 0px #1d70b8, 0 8px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            perspective: 1000px;
        }

        .memory-card.flipped {
            background: #fff;
            border-color: #ffd166;
            box-shadow: 0 6px 0px #e5b23a;
            transform: rotateY(180deg);
        }

        /* --- CONFETI CANVAS --- */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 600px) {
            .game-map { gap: 15px; padding: 10px; }
            .island-card { min-height: 240px; padding: 18px 12px; }
            .island-icon { font-size: 3.8rem; }
            .piano-keyboard { height: 180px; gap: 4px; }
            .piano-key { font-size: 1rem; padding-bottom: 8px; }
            .memory-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .memory-card { height: 95px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- Capa de cielo y elementos flotantes -->
    <div class="sky-container" id="skyContainer">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <!-- Canvas para efecto de Confeti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- ENCABEZADO Y MASCOTA -->
    <header>
        <h1 class="main-title">🌲 El Bosque Mágico ?
